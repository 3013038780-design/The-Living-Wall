name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    # Stable required-check name; lint is included despite the legacy label.
    name: test / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate OpenSpec
        run: npm run spec:validate
        env:
          OPENSPEC_TELEMETRY: '0'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Setup MediaPipe assets
        run: npm run setup:assets

      - name: Build
        run: npm run build
